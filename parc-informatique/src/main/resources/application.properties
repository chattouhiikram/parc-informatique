# ==== Connexion base de données ====
spring.datasource.url=jdbc:postgresql://localhost:5432/parc_informatique_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==== Port du serveur ====
# Le port 8080 est déjà utilisé par une autre application sur cette machine :
# le backend démarre donc sur le port 8081 à la place. Le frontend (axiosConfig.js)
# pointe vers ce même port 8081.
server.port=8081

spring.jackson.deserialization.fail-on-unknown-properties=false